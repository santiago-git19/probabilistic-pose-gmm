# RTMPose-M Model Configuration (Default)
# Real-Time Multi-person Pose estimation - Fastest option

# Model identifier
name: rtmpose_m

# Framework to use
framework: mmpose

# MMPose config path - Note: RTMPose uses simcc, not heatmap
config_path: body_2d_keypoint/rtmpose/coco/rtmpose-m_8xb256-420e_coco-256x192.py

# Checkpoint filename (needs to be downloaded separately)
checkpoint: rtmpose_m_coco.pth

# Model input size [H, W]
input_size: [256, 192]

# Number of keypoints (COCO format)
num_keypoints: 17

# Device configuration
device: ${oc.env:CUDA_VISIBLE_DEVICES,cuda}

# Model-specific preprocessing
preprocessing:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  
# Model characteristics
metadata:
  description: "RTMPose-M for real-time COCO 2D pose estimation"
  accuracy_ap: 75.3  # COCO val2017 AP
  params_millions: 13.6
  flops_gflops: 1.9
  inference_fps: 100  # Approximate on RTX 3080
  
# Note: RTMPose outputs SimCC coordinates, not heatmaps
# The adapter will reconstruct Gaussian heatmaps from coordinates
output_type: simcc
