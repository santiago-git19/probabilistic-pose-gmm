# Hydra Configuration for Robust Pose Estimation with TTA
# Based on structured configuration pattern for reproducible research

defaults:
  - model: hrnet_w32  # Can be overridden: resnet50, vitpose_small, etc.
  - tta
  - sampling  # Monte Carlo sampling configuration
  - mixture
  - _self_

# Random seed for reproducibility
seed: 42

# Project paths (resolved at runtime)
paths:
  project_root: ${hydra:runtime.cwd}
  models_dir: ${paths.project_root}/models
  weights_dir: ${paths.models_dir}/weights
  mmpose_root: ${paths.models_dir}/mmpose
  outputs_dir: ${paths.project_root}/outputs

# Dataset configuration
dataset:
  name: "coco"
  root_dir: "${paths.project_root}/data/coco"
  # Archivos específicos relativos a root_dir
  annotations: "annotations/person_keypoints_val2017.json"
  images: "val2017"
  resize_scale: 1   # < 1.0 reduce la resolución de entrada antes del benchmark
  noise_mean: 0.0
  noise_sigma: 0.0      # > 0 añade ruido gaussiano blanco
  noise_seed: ${seed}   # Semilla para ruido reproducible por imagen
  contrast_factor: 1.0  # < 1.0 disminuye el contraste
  blur_kernel_size: 0    # > 1 aplica Gaussian blur (mejor impar: 3, 5, 7...)
  blur_sigma: 0.0
  smooth_kernel_size: 0  # > 1 aplica un filtro de media (low-pass / smooth)
  
  # Alternative: CrowdPose dataset configuration
  # To use CrowdPose, override with:
  #name: crowdpose
  #root_dir: "${hydra:runtime.cwd}/data/crowdpose"
  #annotations: "json/crowdpose_val.json"
  #images: "images"
  
  # Alternative: OCHuman dataset configuration
  # To use OCHuman, override with:
  #name: ochuman
  #root_dir: "${hydra:runtime.cwd}/data/ochuman"
  #annotations: "annotations/ochuman_coco_format_val_range_0.00_1.00.json"
  #images: "images"

# Mathematical Core Configuration
math_core:
  # Robust Mixture Model Configuration
  # This section controls the RobustGaussianMixture EM algorithm
  mixture_model:
    max_iterations: ${max_iterations}
    convergence_threshold: ${convergence_threshold}
    regularization_strength: ${regularization_strength}
    min_component_weight: ${min_component_weight}
    aic_weight: ${aic_weight}
    bic_weight: ${bic_weight}
    initialization_method: ${initialization_method}
    outer_loop_iterations: ${outer_loop_iterations}
    bootstrap_sample_size: ${bootstrap_sample_size}
    initial_uniform_weight: ${initial_uniform_weight}
    decode_strategy: ${decode_strategy}
    variance_filter_threshold: ${variance_filter_threshold}
    mrf: ${mrf}
  
  # Monte Carlo Sampling parameters
  sampling: ${sampling}

  diagnostics_sampling: ${sampling}



# Post-processing
postprocess:
  use_dark: true  # Distribution-Aware coordinate Representation of Keypoints
  min_confidence: 0.3
  nms_threshold: 0.5

# Evaluation metrics
metrics:
  - oks  # Object Keypoint Similarity
  - pck  # Percentage of Correct Keypoints
  - auc  # Area Under Curve

evaluation:
  n_samples_per_group: 50       # Cuántas imágenes guardar por categoría (Win, Regression...)
  output_dir: ${paths.project_root}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}/eval_results
  batch_size_mass: 32           # Para la evaluación rápida (Runner Modo 1)
  batch_size_deep: 1            # OBLIGATORIO 1 para deep profiling (Runner Modo 2)
  debug_limit: 500             # Poner un número (ej. 10) para pruebas rápidas. Null para dataset completo.

# Logging
logging:
  level: INFO
  save_visualizations: true
  output_dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

# Weights & Biases experiment tracking
# Set enabled: false to disable wandb without changing any code.
wandb:
  enabled: true
  project: "tfg-pose-estimation"
  entity: null                    # null = uses your default W&B entity
