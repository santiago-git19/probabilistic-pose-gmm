# Hydra Configuration for Robust Pose Estimation with TTA
# Based on structured configuration pattern for reproducible research

defaults:
  - model: hrnet_w32  # Can be overridden: resnet50, vitpose_small, etc.
  - tta: default
  - sampling: sampling  # Monte Carlo sampling configuration
  - mixture_model: mixture
  - _self_

# Random seed for reproducibility
seed: 42

# Project paths (resolved at runtime)
paths:
  project_root: ${hydra:runtime.cwd}
  models_dir: ${paths.project_root}/models
  weights_dir: ${paths.models_dir}/weights
  mmpose_root: ${paths.models_dir}/mmpose
  outputs_dir: ${paths.project_root}/outputs

# Dataset configuration
dataset:
  name: "coco"
  root_dir: "${paths.project_root}/data/coco"
  # Archivos específicos relativos a root_dir
  annotations: "annotations/person_keypoints_val2017.json"
  images: "val2017"
  
  # Alternative: CrowdPose dataset configuration
  # To use CrowdPose, override with:
  # dataset.name=crowdpose
  # dataset.root_dir="${hydra:runtime.cwd}/data/crowdpose"
  # dataset.annotations="json/crowdpose_val.json"
  # dataset.images="images"
  
  # Alternative: OCHuman dataset configuration
  # To use OCHuman, override with:
  # dataset.name=ochuman
  # dataset.root_dir="${hydra:runtime.cwd}/data/ochuman"
  # dataset.annotations="annotations/ochuman_coco_format_val_range_0.00_1.00.json"
  # dataset.images="images"

# Test-Time Adaptation parameters
tta:
  # Augmentation strategy
  enabled: true
  num_augmentations: 8
  augmentation_types:
    - horizontal_flip
    - rotation
    - scale
  
  # Rotation parameters (degrees)
  rotation_range: [-15, 15]
  
  # Scale parameters (multiplicative factors)
  scale_range: [0.85, 1.15]
  
  # Aggregation method for heatmaps
  aggregation: mean  # mean, median, weighted_mean

# Mathematical Core Configuration
math_core:
  # Robust Mixture Model Configuration
  # This section controls the RobustGaussianMixture EM algorithm
  mixture_model: ${mixture_model.mixture_model}
  
  # Monte Carlo Sampling parameters
  sampling: ${sampling.sampling}

  diagnostics_sampling: ${sampling.diagnostics}
  
  # Outlier detection
  outlier:
    enabled: true
    method: mahalanobis  # mahalanobis, z_score, isolation_forest
    threshold: 3.0  # Standard deviations for Mahalanobis distance



# Post-processing
postprocess:
  use_dark: true  # Distribution-Aware coordinate Representation of Keypoints
  min_confidence: 0.3
  nms_threshold: 0.5

# Evaluation metrics
metrics:
  - oks  # Object Keypoint Similarity
  - pck  # Percentage of Correct Keypoints
  - auc  # Area Under Curve

# Logging
logging:
  level: INFO
  save_visualizations: true
  output_dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
