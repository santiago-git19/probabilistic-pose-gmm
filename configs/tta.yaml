# Default Test-Time Adaptation Configuration

# Enable/disable TTA
enabled: true

# Scale parameters (multiplicative factors)
# Operates on bounding boxes, NOT on images.  Each scale runs the full
# flip+photometric inner loop, then heatmaps are inverse-transformed and
# aggregated with confidence-weighted averaging to avoid heatmap poisoning
# from out-of-FOV keypoints.
scale:
  enabled: false                     # master switch – flip-only by default
  scales: [0.85, 0.925, 1.0, 1.075, 1.15]          # multiplicative factors (e.g., 0.9 = 10% smaller)
  confidence_threshold: 0.01        # soft floor (deprecated, kept for compatibility)
  aggregation: weighted_mean        # or max_confidence
  
  # Confidence weighting parameters (for weighted_mean aggregation)
  # Formula: conf = peak^α × (1 - 1/(1 + sharp/S))^β
  #   where sharp = peak / (mean + ε)
  # These control how aggressively out-of-FOV (diffuse) heatmaps are suppressed.
  
  sharpness_scale: 10.0 #era 5.0              # S: divisor in sigmoid term
                                    #    Higher → gentler weighting curve
                                    #    Lower  → more aggressive suppression
  
  epsilon: 1.0e-10                  # ε: avoid division by zero in sharpness
  
  peak_exponent: 1.5 #era 1.0                # α: exponent on peak value
                                    #    > 1 → suppress weak peaks more
                                    #    < 1 → more lenient
  
  sharpness_exponent: 1.5 #era 1.0           # β: exponent on sharpness score
                                    #    > 1 → emphasize sharp heatmaps more
                                    #    < 1 → flatten differences

# Horizontal flip
flip:
  enabled: false
  flip_mode: heatmap  # Options: heatmap, udp_combined, offset
  shift_heatmap: true  # Shift flipped heatmaps for better alignment
  flip_indices: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15]  # Indices of symmetric keypoints (e.g., [1, 0, 3, 2, ...])

# Photometric augmentations (cartesian product with geometric)
photometric:
  # Brightness adjustment
  brightness: 
    enabled: false
    delta: 30.0  # Maximum absolute shift in [0, 255] range
  
  # Contrast adjustment
  contrast:
    enabled: false
    range: [0.8, 1.2]  # Multiplicative contrast factor range
  
  # Additive Gaussian noise
  noise:
    enabled: false
    sigma: 10.0  # Standard deviation of Gaussian noise
  
  # Gaussian blur
  blur:
    enabled: false
    kernel_size: 3  # Must be odd (auto-corrected if even)

seed: 42

# Heatmap aggregation method
aggregation:
  method: average  # Options: average, concat
 # weights: null  # If weighted_mean, specify weights --> POSIBLE FUTURE IMPLEMENTATION
  align_corners: false  # Whether to align corners when resizing heatmaps
  target_size: null  # Target size (w, h) for aggregation, null uses first heatmap size

# Post-aggregation processing
post_processing:
  normalize: true  # Normalize aggregated heatmaps to [0, 1]
  apply_nms: false  # Apply non-maximum suppression
