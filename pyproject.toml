[tool.poetry]
name = "robust-pose-tta"
version = "0.1.0"
description = "Test-Time Adaptation for Robust Human Pose Estimation with Uncertainty Quantification"
readme = "README.md"
packages = [{include = "pose_uncertainty", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
numpy = "^1.24.0"
scipy = "^1.11.0"
opencv-python = "^4.8.0"
hydra-core = "^1.3.0"
pycocotools = "^2.0.7"  # For COCO dataset loading
matplotlib = "^3.7.1"
torch = "^2.10.0"
torchvision = "^0.25.0"
openmim = "^0.3.9"
mmengine = "^0.10.7"
mmcv = ">=2.0.0"
wheel = "^0.46.3"
setuptools = "<70.0.0" 
mmpose = {path = "models/mmpose", develop = true}
pip = "^26.0"


[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.7.0"
isort = "^5.12.0"
mypy = "^1.5.0"
flake8 = "^6.1.0"
ipykernel = "^6.25.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
