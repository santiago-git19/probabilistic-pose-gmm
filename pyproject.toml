[tool.poetry]
name = "probabilistic-pose-gmm"
version = "0.1.0"
description = "Test-Time Adaptation for Robust Human Pose Estimation with Uncertainty Quantification"
authors = ["Santiago Reina-Alguacil <santiagoreina@uma.es>", "Ezequiel López-Rubio <ezeqlr@uma.es>"]
license = "Non-commercial"
readme = "README.md"
repository = "https://github.com/santiago-git19/probabilistic-pose-gmm"
packages = [{include = "pose_uncertainty", from = "src"}]

[[tool.poetry.source]]
name = "pytorch_cuda"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
numpy = "^1.24.0"
scipy = "^1.11.0"
opencv-python = "^4.8.0"
hydra-core = "^1.3.0"
pycocotools = "^2.0.7"  # For COCO dataset loading
matplotlib = "^3.7.1"
# 2. MODIFICAR ESTO: Apuntar a la fuente "pytorch_cuda"
torch = {version = "2.1.2", source = "pytorch_cuda"}
torchvision = {version = "0.16.2", source = "pytorch_cuda"}
openmim = "^0.3.0"
mmengine = "^0.8.0"
wheel = "^0.46.3"
setuptools = "<70.0.0"
pip = "^26.0"
mmpretrain = "1.2.0"
seaborn = "^0.13.2"
scikit-learn = "^1.8.0"
pyarrow = "^23.0.0"
fiftyone = "^1.12.0"
pandas = "^3.0.0"
wandb = "^0.25.0"
weave = "^0.52.28"


[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.7.0"
isort = "^5.12.0"
mypy = "^1.5.0"
flake8 = "^6.1.0"
ipykernel = "^6.25.2"
jupyter = "^1.1.1"
nbconvert = "^7.17.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true


[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "-ra --strict-markers --ignore=models/mmpose"
python_files = "test_*.py"
markers = [
    "slow: marks tests as computationally intensive (deselect with '-m \"not slow\"')",
    "requires_mmpose: marks tests requiring mmpose backend weights",
    "integration: end-to-end integration tests",
]
