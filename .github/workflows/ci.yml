name: CI Suite

on:
  push:
    branches: [ main, refactor/cleanup ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & PyTest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Virtualenv
        uses: actions/cache@v4
        id: cached-poetry-dependencies
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install Dependencies
        run: |
          poetry install --no-interaction

      - name: Setup Models & MMPose Engine
        run: |
          poetry run python scripts/models_installation/setup_models.py

      - name: Install OpenMMLab Core Engines
        run: |
          poetry run pip install chumpy==0.70 --no-build-isolation
          poetry run pip install mmcv==2.1.0 -f https://download.openmmlab.com/mmcv/dist/cpu/torch2.1/index.html
          poetry run mim install "mmdet==3.2.0"
          poetry run pip install -e models/mmpose --no-build-isolation

      - name: Environment Health Check
        run: |
          poetry run python src/tests/check_env.py

      - name: Run PyTest Test Suite
        run: |
          poetry run pytest src/tests --ignore=models/mmpose -v
